# Required GitHub Actions check for every PR, including App-created data PRs.
name: data-check

on:
  pull_request:

permissions:
  contents: read

jobs:
  data-check:
    # Keep this job unconditional: branch protection requires its result on every PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/test_pipeline.py
      - name: Check data/ if the PR changes it
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git diff --quiet "$BASE" HEAD -- data || python pipeline/check_data.py
