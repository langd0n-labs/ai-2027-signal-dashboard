# Publishes the site and data/signals.json to the root of the gh-pages branch, which GitHub Pages serves.
# PR previews live under pr-preview/ on the same branch (see preview.yml); this job leaves them in place.
name: Deploy site

on:
  push:
    branches: [main]
    paths: ["site/**", "data/signals.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write # push to gh-pages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Copy site/ but replace its data symlink with only signals.json, so data/evidence/ is not published.
      - name: Build
        run: |
          cp -R site _site
          rm _site/data && mkdir _site/data && cp data/signals.json _site/data/
          touch _site/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: _site
          branch: gh-pages
          clean-exclude: pr-preview
          force: false # rebase onto preview commits instead of overwriting them
