# Classifies every signal for the last complete month (or a backfill range) and opens a pull request
# with the new data. A maintainer reviews and merges it; nothing is pushed to main directly.
name: Update signals

on:
  schedule:
    - cron: "0 14 5 * *" # 14:00 UTC on the 5th, after most monthly data has been released
  workflow_dispatch:
    inputs:
      from:
        description: "First month to classify (YYYY-MM). Leave empty for the last complete month."
        required: false
      to:
        description: "Last month to classify (YYYY-MM). Leave empty for the last complete month."
        required: false
      backfill:
        description: "Mark the entries as backfilled"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-signals

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r pipeline/requirements.txt

      - name: Classify
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SIGNALS_LLM_PROVIDER: ${{ vars.SIGNALS_LLM_PROVIDER }}
          SIGNALS_LLM_MODEL: ${{ vars.SIGNALS_LLM_MODEL }}
          SIGNALS_LLM_EFFORT: ${{ vars.SIGNALS_LLM_EFFORT }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          BACKFILL: ${{ inputs.backfill }}
        run: |
          args=()
          [ -n "$FROM" ] && args+=(--from "$FROM")
          [ -n "$TO" ] && args+=(--to "$TO")
          [ "$BACKFILL" = "true" ] && args+=(--backfill)
          python pipeline/test_pipeline.py
          python pipeline/run.py "${args[@]}" || echo "PARTIAL=1" >> "$GITHUB_ENV"

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          branch="data/run-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -q -F - <<MSG
          Update signal classifications

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          AI-Attribution: AI-G
          MSG
          git push -q origin "$branch"
          note=""
          [ -n "$PARTIAL" ] && note=$'\n\n**Some signals failed to classify.** See the run log before merging.'
          gh pr create --head "$branch" --title "Update signal classifications" --body "$(printf '%s' \
            "Automated run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            $'\n\nThe classifications were generated by the LLM named in each entry. Check the evidence in `data/evidence/` before merging.' \
            "$note" $'\n\nAI-Attribution: AI-G')"

      - name: Fail if any signal failed
        if: env.PARTIAL == '1'
        run: exit 1
